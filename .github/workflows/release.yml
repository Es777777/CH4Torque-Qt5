name: Windows Qt release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build Qt SerialPort module
        shell: cmd
        run: |
          git clone --depth 1 --branch v5.15.2 https://github.com/qt/qtserialport.git qtserialport-src
          cd qtserialport-src
          qmake
          nmake
          nmake install
      - name: Build
        shell: cmd
        run: |
          qmake qt\CH4Torque.pro
          nmake
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\CH4Torque | Out-Null
          Copy-Item release\CH4Torque.exe release\CH4Torque\
          windeployqt --release --compiler-runtime --no-translations release\CH4Torque\CH4Torque.exe
          Copy-Item README.md, LICENSE release\CH4Torque\
          Compress-Archive -Path release\CH4Torque\* -DestinationPath release\CH4Torque-windows-x64.zip -Force
          $hash = (Get-FileHash release\CH4Torque-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  CH4Torque-windows-x64.zip" | Set-Content release\SHA256SUMS.txt -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/CH4Torque-windows-x64.zip
            release/SHA256SUMS.txt
            online-install.ps1
